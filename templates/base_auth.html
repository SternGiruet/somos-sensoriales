<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Acceso{% endblock %} - Gestión Sensorial</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    
    <!-- Bootstrap 5 CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #0d3f7a 0%, #1a2a3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        }
        .auth-header {
            background: var(--gs-primary);
            color: #fff;
            padding: 28px 28px 22px;
            position: relative;
        }
        .auth-wave {
            width: 100%;
            margin-top: -2px;
            display: block;
        }
        .auth-body {
            padding: 10px 32px 32px;
            background: #eef3fa;
        }
        .demo-box {
            background: #fff;
            border: 1.5px dashed #b0c8e8;
            border-radius: 12px;
            padding: 14px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="d-flex align-items-center gap-3 mb-3">
                <img src="{% static 'img/logo.png' %}" alt="Logo" class="brand-logo-img">
                <div>
                    <h1 class="h5 mb-0 fw-bold text-white font-serif">Gestión Sensorial</h1>
                    <p class="small text-white-50 text-uppercase mb-0 letter-spacing-1">Recordando mi espectro</p>
                </div>
            </div>
            {% block auth_header_sub %}{% endblock %}
        </div>
        <svg class="auth-wave" viewBox="0 0 340 24" preserveAspectRatio="none" height="24">
            <path d="M0,0 C60,24 160,0 230,16 C270,24 310,8 340,0 L340,24 L0,24 Z" fill="#eef3fa"/>
        </svg>

        <div class="auth-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show small py-2 px-3 border-0 shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2 px-3" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block auth_content %}{% endblock %}
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
