<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso no autorizado · Gestión Sensorial</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container text-center py-5">
    <div class="card-gs p-4 mx-auto shadow-sm" style="max-width: 500px;">
      <h1 class="display-4 text-danger fw-bold">403</h1>
      <h2 class="h5 fw-bold text-primary mb-3">Acceso Denegado</h2>

        No tienes permisos para acceder a este recurso. El intento ha sido registrado en el log de auditoría del sistema (Ley 21.459).
      </p>
      <a class="btn btn-gs-primary btn-sm" href="{% url 'inicio' %}">Volver al panel principal</a>
    </div>
  </div>
